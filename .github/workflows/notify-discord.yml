# 릴리즈를 디스코드에 알린다 (v2 의 같은 이름 워크플로를 옮겨 왔다, 2026-08-27).
#
# ★★**손으로 돌린다.** 자동으로 걸어 두지 않는 까닭은, 한 번 나간 알림은 **되돌릴 수 없기**
#   때문이다 — 초안을 실수로 공개하는 순간 알림까지 나가면 늦다. 공개한 뒤 눌러서 보낸다.
# ★`releases/latest` 는 **초안과 프리릴리즈를 건너뛴다.** 그래서 태그를 비워 두고 돌리면
#   「지금 공개되어 있는 판」이 잡힌다 (아직 초안이면 그 앞 판이 잡히니 태그를 적어 준다).
# ★v2 와 다른 점: 이쪽은 **윈도우 한 벌**이라 플랫폼을 고르는 칸이 없고, 자산 이름에
#   버전이 들어간다 (`PeroPix-3.0.0-win64.zip`).
#
# ★★**시크릿이 있어야 돈다**: 저장소 설정에 `DISCORD_WEBHOOK` 을 넣어 둘 것.
name: Notify Discord
run-name: Notify Discord ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "알릴 태그 (비우면 가장 최근에 공개된 릴리즈)"
        required: false
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 릴리즈 읽기
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WANT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$WANT" ]; then
            REL=$(gh api "repos/${{ github.repository }}/releases/tags/$WANT")
          else
            REL=$(gh api "repos/${{ github.repository }}/releases/latest")
          fi
          echo "$REL" | jq -r '.body // ""' > /tmp/body.txt
          {
            echo "tag=$(echo "$REL" | jq -r '.tag_name')"
            echo "draft=$(echo "$REL" | jq -r '.draft')"
          } >> "$GITHUB_OUTPUT"

      - name: 디스코드로 보내기
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TAG: ${{ steps.rel.outputs.tag }}
          DRAFT: ${{ steps.rel.outputs.draft }}
        run: |
          set -euo pipefail
          # ★★**「없음」과 「비어 있음」을 갈라 준다** (실측 2026-08-27: 시크릿은 등록되어
          #   있는데 값이 빈 채로 도착해, 「없습니다」만 보고 한참 헤맸다). 길이는 찍어도
          #   안전하다 — 값이 아니라 숫자이고, 깃허브가 값 자체는 로그에서 가린다.
          if [ -z "${HOOK:-}" ]; then
            echo "::error::DISCORD_WEBHOOK 이 비어 있습니다 (길이 ${#HOOK}). 이름은 등록돼 있어도"
            echo "::error::값이 빈 채로 저장됐을 수 있습니다 — gh secret set DISCORD_WEBHOOK 으로 다시 넣어 주세요"
            exit 1
          fi
          # ★모양만 본다 (값은 절대 안 찍는다) — 엉뚱한 것을 넣었으면 여기서 걸린다
          case "$HOOK" in
            https://discord.com/api/webhooks/*|https://discordapp.com/api/webhooks/*|https://canary.discord.com/api/webhooks/*) ;;
            *) echo "::error::DISCORD_WEBHOOK 이 디스코드 웹후크 주소 모양이 아닙니다 (길이 ${#HOOK})"; exit 1 ;;
          esac
          # ★초안은 받는 사람이 열 수 없다 — 알리기 전에 세운다
          if [ "$DRAFT" = "true" ]; then
            echo "::error::$TAG 는 아직 초안입니다. 공개한 뒤에 돌려 주세요"
            exit 1
          fi

          VER="${TAG#v}"
          DL="https://github.com/${{ github.repository }}/releases/download/${TAG}/PeroPix-${VER}-win64.zip"

          # ★★**디스코드 상한(2,000자)을 넘지 않게만 자른다.** 넘으면 400 으로 되돌아오고,
          #   머리말과 내려받기 줄이 차지하는 만큼을 빼고 남는 자리를 본문에 준다 — 짧으면 안 자른다.
          #   ★자르기는 `jq` 로 한다: 바이트가 아니라 **글자** 기준이라 한글이 중간에 안 끊긴다.
          # ★**`flags: 4` 는 SUPPRESS_EMBEDS** — 링크에서 저절로 생기는 미리보기를 끈다 (매번
          #   손으로 지우고 있었다). `embeds` 배열을 안 쓰므로 이 플래그가 지우는 것은 그 미리보기뿐이다.
          jq -n \
            --arg tag "$TAG" \
            --arg body "$(cat /tmp/body.txt)" \
            --arg dl "$DL" \
            --arg repo "https://github.com/${{ github.repository }}" \
            '"🚀 **PeroPix \($tag)** 릴리즈!" as $head
             | "\n\n📥 [내려받기](\($dl))  ·  🔗 [깃허브](\($repo))" as $tail
             | (2000 - ($head | length) - ($tail | length) - 3) as $room
             | ($body | if length > $room then .[0:$room] + "…" else . end) as $b
             | (if ($b | gsub("\\s"; "")) == "" then "" else "\n\n" + $b end) as $mid
             | {content: ($head + $mid + $tail), flags: 4}' \
            > /tmp/payload.json

          # ★★**실패를 삼키지 않는다.** 그냥 `curl` 은 400 을 받아도 성공으로 끝나, 알림이
          #   안 갔는데 초록불이 뜬다 (v2 가 그 모양이었다).
          curl --fail-with-body -sS -H "Content-Type: application/json" -d @/tmp/payload.json "$HOOK"
          echo "보냈습니다: $TAG"
