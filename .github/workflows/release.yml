# PeroPix 3.0 — 릴리즈 빌드
#
# ★★산출물은 **포터블 zip 하나**다 (설치 프로그램이 아니라).
#   앱이 `data/`·`workspaces/`·`logs/` 를 **실행 파일 옆에** 쓰기 때문이다
#   (`src-tauri/src/backend.rs` 의 `find_repo_root`). Program Files 에 설치하면
#   그 자리가 쓰기 금지라 첫 실행부터 막힌다. v2 도 같은 이유로 zip 이었다.
#
# ★파이썬은 **임베드본을 받아 넣는다** (v2 `build-and-release.yml` 과 같은 방식) —
#   앱은 `python/python.exe` 가 옆에 있으면 그것을 쓰고, 없으면 PATH 의 python 을 찾는다.
#
# 여는 방법: 태그를 밀거나(`v3.0.1`) Actions 에서 손으로 돌린다.
name: Release
# ★★제목은 **태그**다 (사용자 지적 2026-08-27) — v2 저장소가 그렇게 보이는 까닭은 그쪽이
#   `release` 사건으로 돌아 릴리즈 이름이 곧 제목이기 때문이다. 여기는 태그 밀기로 도니
#   적어 주지 않으면 커밋 메시지가 제목이 된다.
#   ★손으로 돌린 것은 태그가 없다 — 그때는 릴리즈도 안 만들고 아티팩트만 남기므로
#     그 사실을 제목에 적는다 (목록에서 진짜 릴리즈와 섞이지 않게).
run-name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Release (dry run)' }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# ★같은 태그로 두 번 오면 하나만 남긴다 (실측 2026-09-03: v3.0.9 공개 때 태그 push 이벤트가
#   5초 간격으로 두 번 들어와 릴리즈가 두 번 돌았다 — 같은 자산을 동시에 올리는 경쟁이 된다).
#   뒤의 실행이 앞의 것을 취소한다. 다른 태그·수동 실행끼리는 서로 안 막는다.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # ★v2 와 같은 3.11 계열. 올릴 때는 `_pth` 파일 이름(`python311._pth`)도 함께 본다
  PY_VERSION: "3.11.9"
  PY_PTH: "python311._pth"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # ★★**태그를 전부 받아야 한다** (`fetch-depth: 0`). 기본값(1)은 밀린 그 태그 하나만
      #   받아 오는데, 아래 `patch-info.json` 이 **직전 태그**를 찾아 의존성·검열 모델이
      #   바뀌었는지 본다. 안 받으면 직전 태그가 늘 비어 `requires_full` 이 **영영 false** 다
      #   — 전체를 받아야 할 판에 앱이 패치를 받고, 조용히 반쯤 갈린다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Rust 툴체인
        uses: dtolnay/rust-toolchain@stable

      # ★Rust 빌드는 오래 걸린다 — 캐시가 없으면 릴리즈마다 10분씩 더 든다
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: 의존성 설치
        run: npm ci

      # ★버전은 **태그가 정본**이다. `tauri.conf.json`·`package.json` 과 어긋나면
      #   받은 사람이 어느 것이 맞는지 알 수 없으므로 빌드 전에 태그 값으로 맞춘다.
      - name: 버전을 태그에 맞춘다
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d') { $tag = "v0.0.0" }
          $ver = $tag -replace '^v', ''
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = $ver
          $conf | ConvertTo-Json -Depth 32 | Set-Content src-tauri/tauri.conf.json -Encoding UTF8
          npm version $ver --no-git-tag-version --allow-same-version
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "version = $ver"

      # ★★**판정은 여기서 안 돌린다** (사용자 결정 2026-08-26). 하네스(`test.bat` 과
      #   `backend/test_*.py`·`*.test.ts`)는 **깃에 안 올라간다** — 배포물이 아닌 것은
      #   저장소에 안 둔다는 2026-08-13 결정이고 `.gitignore` 33~39행이 그것이다.
      #   러너는 저장소를 새로 받으므로 그 자리에 파일이 없다.
      #   ★그러니 **태그를 밀기 전에 손으로 `test.bat` 을 돌린다.** 이 단계가 대신해 주지 않는다.
      - name: 앱 빌드 (프런트 + Tauri)
        run: npm run tauri build -- --no-bundle

      # ── 배포 꾸러미 ────────────────────────────────────────────
      # ★★**조립은 `scripts/portable.ps1` 하나가 한다** (2026-08-26). 예전에는 이 파일에
      #   복사 목록이 따로 적혀 있었는데, 손으로 만드는 포터블(`portable.bat`)과 두 벌이 되어
      #   한쪽만 고쳐질 자리였다. 임베드 파이썬·의존성·검열 모델·`version.json` 이 전부 그쪽에 있다.
      # ★빌드는 위에서 이미 했다 (`--no-bundle`) — `-SkipBuild` 로 그것을 그대로 쓴다.
      # ★★`shell: pwsh` 가 이미 파워셸 7 이다 — 그 안에서 `powershell.exe`(5.1)를 다시
      #   부르지 않는다. 5.1 은 BOM 없는 스크립트를 **러너의 ANSI 코드페이지**로 읽어
      #   한글 주석에서 따옴표가 깨지고 파싱 단계에서 죽는다 (실측 2026-08-26).
      #   스크립트에 BOM 도 붙여 두었지만, 여기서도 7 로 바로 부른다.
      - name: 포터블 꾸러미
        shell: pwsh
        run: ./scripts/portable.ps1 -SkipBuild

      # ── 패치 (평소 업데이트가 받는 것) ─────────────────────────
      # ★★v3 는 화면이 **실행 파일 안에** 박혀서, 글자 하나를 고쳐도 exe 를 갈아야 한다.
      #   그래도 파이썬(약 140MB)과 검열 모델(39MB)이 빠져 **35MB 대 130MB** 다.
      # ★★푼 모습이 **앱 폴더와 같아야 한다** (겉 폴더를 만들지 않는다) — 껍데기가
      #   `.update/new/` 의 것을 그대로 제자리에 옮기기 때문이다 (`src-tauri/src/update.rs`).
      - name: 패치 꾸러미
        shell: pwsh
        run: |
          # ★★**푼 모습이 앱 폴더와 같아야 한다.** 앱 것은 `app/` 안에 있으므로 패치도
          #   그 배치 그대로 담는다 — 껍데기가 이것을 **파일 단위로 겹쳐 놓기** 때문에
          #   `app/python` 같은 형제는 건드리지 않는다 (`update.rs` 의 `move_tree`).
          $p = "_dist/patch"
          New-Item -ItemType Directory -Force -Path "$p/app" | Out-Null
          Copy-Item "_dist/PeroPix/PeroPix.exe" $p
          Copy-Item "_dist/PeroPix/app/backend" "$p/app" -Recurse
          Copy-Item "_dist/PeroPix/app/version.json" "$p/app"
          Compress-Archive -Path "$p/*" -DestinationPath "_dist/patch-${{ env.VERSION }}.zip"

      # ★★**의존성·검열 모델이 바뀐 판은 패치로 못 넘긴다** — 패치에 안 담기기 때문이다.
      #   그런 판은 전체로 넘긴다. 앱이 이 파일을 보고 **스스로 고르고, 사용자에게는 안 묻는다**
      #   (사용자 지시 2026-08-26: 「이번엔 전체를 받아야 합니다」 같은 문구를 안 낸다).
      # ★앱은 pip 를 돌리지 않는다 — 중간에 실패하면 파이썬이 반쯤 갈린 채 남는다.
      - name: patch-info.json
        shell: bash
        run: |
          # ★★**커밋 순서로 바로 앞 태그**를 고른다 (실측 2026-08-27).
          #   예전에는 `git tag --sort=-version:refname | head -1` 이었는데, 그것은 **버전
          #   크기순**이라 옛 `v3.0.0-rc.1` 이 언제나 맨 위였다 (3 > 0). 그 하나가 두 값을
          #   동시에 망쳤다: `patch_from` 이 늘 `3.0.0-rc.1` 이라 앱의 「내 버전 ≥ patch_from」이
          #   거짓이 되고, rc.1 이후로는 `requirements.txt` 가 당연히 바뀌었으니
          #   `requires_full` 도 늘 참이었다. 그래서 **패치는 한 번도 쓰인 적이 없고**
          #   (릴리즈 다섯 개의 patch-info.json 이 전부 같았다) 늘 132MB 를 받았다.
          #   28MB 짜리 패치는 같은 릴리즈에 올라간 채 아무도 안 받았다.
          # ★`--match 'v*'` — 릴리즈가 아닌 태그(`chip-edit-before`)에 걸리지 않게.
          PREV=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          REQ=false
          # ★★**패치에 안 담기는 것이 바뀌면 전체로 보낸다.** 의존성(`requirements.txt`)과
          #   검열 모델이 그렇고, 거기에 **`scripts/full-required.txt`** 를 더한다 — 폴더
          #   배치처럼 「파일 목록만 봐서는 안 드러나는」 변화를 손으로 적어 두는 자리다.
          #   그 파일의 **내용이 바뀐 판**만 깃발이 켜진다 (있다는 것만으로는 안 켜진다).
          if [ -n "$PREV" ] && [ -n "$(git diff --name-only "$PREV" HEAD -- backend/requirements.txt models/censor scripts/full-required.txt || true)" ]; then
            REQ=true
          fi
          printf '{"version":"%s","patch_from":"%s","requires_full":%s}' "$VERSION" "${PREV#v}" "$REQ" > _dist/patch-info.json
          cat _dist/patch-info.json

      - name: 손으로 돌린 것은 아티팩트로만
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: PeroPix-Windows
          path: |
            _dist/PeroPix-*-win64.zip
            _dist/patch-*.zip
            _dist/patch-info.json

      # ★태그를 민 것만 릴리즈가 된다 — 손으로 돌린 빌드가 릴리즈를 만들면
      #   확인용으로 한 번 돌릴 때마다 받은 사람에게 알림이 간다
      - name: 릴리즈에 올린다
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            _dist/PeroPix-${{ env.VERSION }}-win64.zip
            _dist/patch-${{ env.VERSION }}.zip
            _dist/patch-info.json
          draft: true
          # ★★**자동 변경 이력을 안 붙인다** (사용자 지시 2026-08-27). 커밋 목록이 통째로
          #   들어가 릴리즈가 지저분해지고, **그것이 그대로 디스코드 알림까지 딸려 간다**
          #   (`notify-discord.yml` 이 릴리즈 본문을 그대로 싣는다).
          #   ★본문은 초안을 공개하기 전에 **손으로 적는다** — 받는 사람이 읽을 것만.
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
