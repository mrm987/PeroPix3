[package]
name = "peropix"
version = "3.0.0"
description = "PeroPix — NAI 전용 이미지 생성 툴"
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[lib]
name = "peropix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ★고아 사이드카 방지 — 파이썬 자식을 Job Object 에 매단다 (backend.rs `adopt_into_job`).
#   tauri 가 이미 끌어오는 크레이트라 새로 받는 것이 없다.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading",
  # ★Tauri 의 크기 조절 덧창을 찾아 없앤다 (window_edge.rs)
  "Win32_UI_WindowsAndMessaging",
  # ★최대화 창을 커서 아래로 한 번에 복원해 끌기 시작한다 (window_edge.rs 의 drag_restore)
  "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi",
] }

# ★맥 — 같은 폴더 잠금(`flock`)과 백엔드를 프로세스 그룹째 내리기(`kill`). tauri 가 이미 끌어오는 크레이트다
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
strip = true
